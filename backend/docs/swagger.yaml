basePath: /api/v1
definitions:
  APIError:
    properties:
      error:
        $ref: '#/definitions/ErrorDetail'
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  APIResponse:
    properties:
      data: {}
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  CreateMemberRequest:
    properties:
      emailId:
        maxLength: 255
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
      role:
        type: string
    required:
    - emailId
    - fullName
    - role
    type: object
  CreateMemberResponse:
    properties:
      expiresAt:
        type: string
      invitationId:
        type: string
      userId:
        type: string
    type: object
  ErrorDetail:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  HealthResponse:
    properties:
      service:
        example: workspace-hub-server
        type: string
      status:
        example: ok
        type: string
    type: object
  ListMembersResponse:
    properties:
      activeCount:
        type: integer
      invitedCount:
        type: integer
      members:
        items:
          $ref: '#/definitions/MemberResponse'
        type: array
      suspendedCount:
        type: integer
      total:
        type: integer
    type: object
  LoginRequest:
    properties:
      emailId:
        type: string
      password:
        type: string
    required:
    - emailId
    - password
    type: object
  LoginResponse:
    properties:
      accessToken:
        type: string
    type: object
  MemberResponse:
    properties:
      createdAt:
        type: string
      emailId:
        type: string
      fullName:
        type: string
      lastActiveAt:
        type: string
      profilePicture:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  RegisterResponse:
    properties:
      message:
        type: string
    type: object
  RegisterUserRequest:
    properties:
      emailId:
        maxLength: 255
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      tenantName:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - emailId
    - fullName
    - password
    - tenantName
    type: object
  TenantDetails:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      subdomain:
        type: string
    type: object
  UpdateTenantRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  UpdateUserProfileRequest:
    properties:
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
    required:
    - fullName
    type: object
  UserProfileResponse:
    properties:
      createdAt:
        type: string
      emailId:
        type: string
      fullName:
        type: string
      id:
        type: string
      lastActiveAt:
        type: string
      profilePicture:
        type: string
      role:
        type: string
      status:
        type: string
      tenantDetails:
        $ref: '#/definitions/TenantDetails'
    type: object
host: localhost:8083
info:
  contact:
    email: harshalganbote55@gmail.com
    name: Farm Deck Support
  description: |-
    Farm management multi-tenant API.
    All responses follow a standard envelope (see Schemas).
  license:
    name: Proprietary
  title: Farm Deck API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: login successful
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: invalid email or password
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current refresh token and clears auth cookies.
      produces:
      - application/json
      responses:
        "200":
          description: logged out
          schema:
            $ref: '#/definitions/RegisterResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      description: Uses the httpOnly refresh_token cookie to issue a new access token
        (and rotates the refresh token).
      produces:
      - application/json
      responses:
        "200":
          description: tokens refreshed
          schema:
            $ref: '#/definitions/LoginResponse'
        "401":
          description: refresh token missing, invalid, or expired
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new tenant and the first owner user, then sends a welcome
        email.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user registered successfully
          schema:
            $ref: '#/definitions/RegisterResponse'
        "400":
          description: validation error or bad request
          schema:
            $ref: '#/definitions/APIError'
        "409":
          description: user or tenant already exists
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Register a new user and tenant
      tags:
      - auth
  /health:
    get:
      description: Returns the service status. Does not require authentication.
      produces:
      - application/json
      responses:
        "200":
          description: service is healthy
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Liveness check
      tags:
      - health
  /tenants/me:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Tenant update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: tenant updated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Update current tenant
      tags:
      - tenant
  /users/me:
    get:
      description: Returns the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: user profile
          schema:
            $ref: '#/definitions/UserProfileResponse'
        "401":
          description: authentication required or invalid token
          schema:
            $ref: '#/definitions/APIError'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Get current user profile
      tags:
      - user
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: profile updated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Update current user profile
      tags:
      - user
  /users/members:
    get:
      description: Returns all members of the caller's tenant except the caller (owner
        only), with status counts and last-active time.
      produces:
      - application/json
      responses:
        "200":
          description: tenant members with status counts
          schema:
            $ref: '#/definitions/ListMembersResponse'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "403":
          description: only owner can list members
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List tenant members
      tags:
      - user
    post:
      consumes:
      - application/json
      description: Creates an invited user (owner only) and sends an invitation email
        with an accept-invite link.
      parameters:
      - description: New member payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: created member + invitation details
          schema:
            $ref: '#/definitions/CreateMemberResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "403":
          description: only owner can create member
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Invite a new member to the tenant
      tags:
      - user
schemes:
- http
- https
securityDefinitions:
  CookieAuth:
    description: JWT set by POST /auth/login.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
