basePath: /api/v1
definitions:
  APIError:
    properties:
      error:
        $ref: '#/definitions/ErrorDetail'
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  APIResponse:
    properties:
      data: {}
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  AcceptInvitationRequest:
    properties:
      password:
        description: same rules as register
        maxLength: 72
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  CreateMemberRequest:
    properties:
      emailId:
        maxLength: 255
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
      role:
        type: string
    required:
    - emailId
    - fullName
    - role
    type: object
  CreateMemberResponse:
    properties:
      expiresAt:
        type: string
      invitationId:
        type: string
      userId:
        type: string
    type: object
  ErrorDetail:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  FarmInfo:
    properties:
      areaUnit:
        example: acres
        type: string
      createdAt:
        example: "2026-08-22T09:00:00Z"
        type: string
      farmTypeID:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      id:
        example: 11111111-1111-1111-1111-111111111111
        type: string
      isActive:
        example: true
        type: boolean
      latitude:
        example: 18.5204
        type: number
      location:
        example: Pune, MH
        type: string
      longitude:
        example: 73.8567
        type: number
      name:
        example: Greenfield Orchard
        type: string
      notes:
        example: North-facing slope, drip irrigation installed
        type: string
      totalArea:
        example: 12.5
        type: number
      updatedAt:
        example: "2026-08-22T09:00:00Z"
        type: string
    type: object
  FarmTypeResponse:
    properties:
      description:
        type: string
      displayName:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  HealthResponse:
    properties:
      service:
        example: workspace-hub-server
        type: string
      status:
        example: ok
        type: string
    type: object
  HydroSystemTypeResponse:
    properties:
      description:
        type: string
      displayName:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  ListFarmResponse:
    properties:
      active:
        example: 2
        type: integer
      farms:
        items:
          $ref: '#/definitions/FarmInfo'
        type: array
      inactive:
        example: 1
        type: integer
      total:
        example: 3
        type: integer
    type: object
  ListMembersResponse:
    properties:
      activeCount:
        type: integer
      invitedCount:
        type: integer
      members:
        items:
          $ref: '#/definitions/MemberResponse'
        type: array
      total:
        type: integer
    type: object
  LoginRequest:
    properties:
      emailId:
        type: string
      password:
        type: string
    required:
    - emailId
    - password
    type: object
  LoginResponse:
    properties:
      accessToken:
        type: string
    type: object
  ManageFarmRequest:
    properties:
      areaUnit:
        example: acres
        maxLength: 50
        minLength: 2
        type: string
      farmTypeID:
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        type: string
      latitude:
        example: 18.5204
        type: number
      location:
        example: Pune, MH
        type: string
      longitude:
        example: 73.8567
        type: number
      name:
        example: Greenfield Orchard
        maxLength: 255
        minLength: 2
        type: string
      notes:
        example: North-facing slope, drip irrigation installed
        type: string
      totalArea:
        example: 12.5
        type: number
    required:
    - areaUnit
    - farmTypeID
    - name
    type: object
  MemberResponse:
    properties:
      createdAt:
        type: string
      emailId:
        type: string
      fullName:
        type: string
      id:
        type: string
      lastActiveAt:
        type: string
      profilePicture:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  RegisterResponse:
    properties:
      message:
        type: string
    type: object
  RegisterUserRequest:
    properties:
      emailId:
        maxLength: 255
        type: string
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      tenantName:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - emailId
    - fullName
    - password
    - tenantName
    type: object
  SoilTypeResponse:
    properties:
      description:
        type: string
      displayName:
        type: string
      drainage:
        type: string
      id:
        type: string
      name:
        type: string
      waterRetention:
        type: string
    type: object
  TenantDetails:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      subdomain:
        type: string
    type: object
  UpdateMemberRequest:
    properties:
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
      role:
        type: string
    required:
    - fullName
    - role
    type: object
  UpdateTenantRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  UpdateUserProfileRequest:
    properties:
      fullName:
        maxLength: 100
        minLength: 2
        type: string
      profilePicture:
        type: string
    required:
    - fullName
    type: object
  UserProfileResponse:
    properties:
      createdAt:
        type: string
      emailId:
        type: string
      fullName:
        type: string
      id:
        type: string
      lastActiveAt:
        type: string
      profilePicture:
        type: string
      role:
        type: string
      status:
        type: string
      tenantDetails:
        $ref: '#/definitions/TenantDetails'
    type: object
  VerifyInvitationResponse:
    properties:
      emailId:
        type: string
      expiresAt:
        type: string
      fullName:
        type: string
      role:
        type: string
      tenantName:
        type: string
    type: object
  ZoneTypeResponse:
    properties:
      cultivationMode:
        type: string
      description:
        type: string
      displayName:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8083
info:
  contact:
    email: harshalganbote55@gmail.com
    name: Farm Deck Support
  description: |-
    Farm management multi-tenant API.
    All responses follow a standard envelope (see Schemas).
  license:
    name: Proprietary
  title: Farm Deck API
  version: "1.0"
paths:
  /auth/accept-invitation:
    post:
      consumes:
      - application/json
      description: Accepts the invitation token, creates the invitee's credential
        with the chosen password, activates their user account, and logs them in (auth
        cookies are set).
      parameters:
      - description: Accept invitation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AcceptInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: invitation accepted, user logged in
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: validation error, or token invalid/expired/revoked
          schema:
            $ref: '#/definitions/APIError'
        "409":
          description: invitation already accepted
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Accept an invitation and set the account password
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: login successful
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: invalid email or password
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Log in
      tags:
      - auth
  /auth/logout:
    post:
      description: Revokes the current refresh token and clears auth cookies.
      produces:
      - application/json
      responses:
        "200":
          description: logged out
          schema:
            $ref: '#/definitions/RegisterResponse'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Log out
      tags:
      - auth
  /auth/refresh:
    post:
      description: Uses the httpOnly refresh_token cookie to issue a new access token
        (and rotates the refresh token).
      produces:
      - application/json
      responses:
        "200":
          description: tokens refreshed
          schema:
            $ref: '#/definitions/LoginResponse'
        "401":
          description: refresh token missing, invalid, or expired
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new tenant and the first owner user, then sends a welcome
        email.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/RegisterUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: user registered successfully
          schema:
            $ref: '#/definitions/RegisterResponse'
        "400":
          description: validation error or bad request
          schema:
            $ref: '#/definitions/APIError'
        "409":
          description: user or tenant already exists
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Register a new user and tenant
      tags:
      - auth
  /auth/verify-invitation:
    get:
      description: Checks the raw invitation token from the email link and returns
        the invitee and tenant details so the accept-invite page can render. The token
        must be valid, unexpired, and not yet accepted or revoked.
      parameters:
      - description: Raw invitation token from the email link
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: invitation details
          schema:
            $ref: '#/definitions/VerifyInvitationResponse'
        "400":
          description: token missing, invalid, expired, or revoked
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      summary: Verify an invitation token
      tags:
      - auth
  /farms:
    get:
      description: Returns every farm belonging to the caller's tenant, along with
        active/inactive counts. Pass is_active to filter by active state; omit it
        to return all farms.
      parameters:
      - description: Filter by active state. Omit to return all farms (active and
          inactive).
        in: query
        name: is_active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: tenant farms with status counts
          schema:
            allOf:
            - $ref: '#/definitions/APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/ListFarmResponse'
              type: object
        "400":
          description: is_active must be a boolean
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List tenant farms
      tags:
      - farm
    post:
      consumes:
      - application/json
      description: Creates a farm owned by the caller's tenant. Authorization is gated
        by the workspace.manage permission at the route level.
      parameters:
      - description: Farm create payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ManageFarmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: farm created successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Create a new farm
      tags:
      - farm
  /farms/{id}:
    patch:
      description: Soft-deactivates the farm with the given id (sets is_active=false).
        Authorization is gated by the workspace.manage permission at the route level.
      parameters:
      - description: Farm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: farm inactivated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: invalid farm id
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Inactivate a farm
      tags:
      - farm
    put:
      consumes:
      - application/json
      description: Updates the farm with the given id. Authorization is gated by the
        workspace.manage permission at the route level.
      parameters:
      - description: Farm ID
        in: path
        name: id
        required: true
        type: string
      - description: Farm update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ManageFarmRequest'
      produces:
      - application/json
      responses:
        "200":
          description: farm updated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: invalid farm id or validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "404":
          description: farm not found
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Update a farm
      tags:
      - farm
  /farms/{id}/activate:
    patch:
      description: Reactivates the farm with the given id (sets is_active=true). Authorization
        is gated by the workspace.manage permission at the route level.
      parameters:
      - description: Farm ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: farm activated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: invalid farm id
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Activate a farm
      tags:
      - farm
  /health:
    get:
      description: Returns the service status. Does not require authentication.
      produces:
      - application/json
      responses:
        "200":
          description: service is healthy
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Liveness check
      tags:
      - health
  /lookups/farm-types:
    get:
      description: Returns the available farm (growing environment) types, e.g. indoor,
        outdoor, greenhouse, mixed.
      produces:
      - application/json
      responses:
        "200":
          description: list of farm types
          schema:
            allOf:
            - $ref: '#/definitions/APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/FarmTypeResponse'
                  type: array
              type: object
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List farm types
      tags:
      - lookup
  /lookups/hydro-system-types:
    get:
      description: Returns the available hydroponic system types, e.g. NFT, DWC, Ebb
        & Flow, aeroponics, drip, Kratky.
      produces:
      - application/json
      responses:
        "200":
          description: list of hydroponic system types
          schema:
            allOf:
            - $ref: '#/definitions/APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/HydroSystemTypeResponse'
                  type: array
              type: object
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List hydroponic system types
      tags:
      - lookup
  /lookups/soil-types:
    get:
      description: Returns the available soil types with their water retention and
        drainage characteristics, e.g. loamy, sandy, clay, silt, sandy loam, clay
        loam.
      produces:
      - application/json
      responses:
        "200":
          description: list of soil types
          schema:
            allOf:
            - $ref: '#/definitions/APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/SoilTypeResponse'
                  type: array
              type: object
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List soil types
      tags:
      - lookup
  /lookups/zone-types:
    get:
      description: Returns the available zone (production area) types within a farm,
        e.g. soil plot, hydroponic system, aquaponic, mushroom room, along with their
        cultivation mode.
      produces:
      - application/json
      responses:
        "200":
          description: list of zone types
          schema:
            allOf:
            - $ref: '#/definitions/APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/ZoneTypeResponse'
                  type: array
              type: object
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List zone types
      tags:
      - lookup
  /tenants/me:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Tenant update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateTenantRequest'
      produces:
      - application/json
      responses:
        "200":
          description: tenant updated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "403":
          description: 'requires permission: workspace.manage'
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Update current tenant
      tags:
      - tenant
  /users/me:
    get:
      description: Returns the profile of the currently authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: user profile
          schema:
            $ref: '#/definitions/UserProfileResponse'
        "401":
          description: authentication required or invalid token
          schema:
            $ref: '#/definitions/APIError'
        "404":
          description: user not found
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Get current user profile
      tags:
      - user
    patch:
      consumes:
      - application/json
      parameters:
      - description: Profile update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateUserProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: profile updated successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Update current user profile
      tags:
      - user
  /users/members:
    get:
      description: Returns all members of the caller's tenant except the caller (owner
        only), with status counts and last-active time.
      produces:
      - application/json
      responses:
        "200":
          description: tenant members with status counts
          schema:
            $ref: '#/definitions/ListMembersResponse'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "403":
          description: only owner can list members
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: List tenant members
      tags:
      - user
    post:
      consumes:
      - application/json
      description: Creates an invited user (owner only) and sends an invitation email
        with an accept-invite link.
      parameters:
      - description: New member payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateMemberRequest'
      produces:
      - application/json
      responses:
        "200":
          description: created member + invitation details
          schema:
            $ref: '#/definitions/CreateMemberResponse'
        "400":
          description: validation error
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "403":
          description: only owner can create member
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
      - CookieAuth: []
      summary: Invite a new member to the tenant
      tags:
      - user
  /users/members/{memberId}:
    delete:
      description: Soft-deletes a member (owner only).
      parameters:
      - description: Member ID
        in: path
        name: memberId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: member deleted successfully
          schema:
            $ref: '#/definitions/APIResponse'
        "400":
          description: invalid member id
          schema:
            $ref: '#/definitions/APIError'
        "401":
          description: authentication required
          schema:
            $ref: '#/definitions/APIError'
        "403":
          description: only owner can delete member
          schema:
            $ref: '#/definitions/APIError'
        "404":
          description: member not found
          schema:
            $ref: '#/definitions/APIError'
        "500":
          description: internal server error
          schema:
            $ref: '#/definitions/APIError'
      security:
